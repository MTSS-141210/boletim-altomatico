<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Boletim</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📓</text></svg>">
    <style>
        :root {
            --bg: #f6f4ef;
            --panel: #ffffff;
            --ink: #1f2420;
            --muted: #6b7268;
            --line: #e2ddd1;
            --ok: #2f6f4f;
            --ok-bg: #e7f1ea;
            --bad: #a13d2c;
            --bad-bg: #fbeae5;
            --accent: #3d5a4c;
            --input-bg: #fbfaf6;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #161915;
                --panel: #1e2219;
                --ink: #eae7de;
                --muted: #9aa196;
                --line: #33382e;
                --ok: #7fcda1;
                --ok-bg: #1d2c22;
                --bad: #e08669;
                --bad-bg: #2e1e19;
                --accent: #9fc2ab;
                --input-bg: #22271c;
            }
        }

        :root[data-theme="dark"] {
            --bg: #161915;
            --panel: #1e2219;
            --ink: #eae7de;
            --muted: #9aa196;
            --line: #33382e;
            --ok: #7fcda1;
            --ok-bg: #1d2c22;
            --bad: #e08669;
            --bad-bg: #2e1e19;
            --accent: #9fc2ab;
            --input-bg: #22271c;
        }

        * { box-sizing: border-box; }
        html { scroll-padding-top: env(safe-area-inset-top, 0px); }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: "Iowan Old Style", "Georgia", serif;
            min-height: 100%;
        }
        [hidden] { display: none !important; }

        header {
            padding: 28px 20px 18px;
            max-width: 920px;
            margin: 0 auto;
        }
        h1 {
            font-size: 22px;
            font-weight: 600;
            margin: 0 0 2px;
            letter-spacing: .2px;
        }
        .sub {
            color: var(--muted);
            font-size: 14px;
            margin: 0;
            font-family: -apple-system, system-ui, sans-serif;
        }

        main {
            max-width: 920px;
            margin: 0 auto;
            padding: 0 20px 40px;
        }

        .setup-panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 22px;
        }
        .setup-form {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .setup-form input[type="text"] {
            flex: 1;
            padding: 11px 12px;
            font-size: 15px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--ink);
            font-family: inherit;
        }
        .setup-form input[type="text"]:focus {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }
        .btn {
            font-family: -apple-system, system-ui, sans-serif;
            font-weight: 600;
            font-size: 14px;
            padding: 11px 16px;
            border-radius: 8px;
            border: 1px solid var(--accent);
            background: var(--accent);
            color: var(--panel);
            cursor: pointer;
        }
        .btn:disabled {
            opacity: .45;
            cursor: not-allowed;
        }
        .btn.secondary {
            background: transparent;
            color: var(--accent);
        }
        .btn.ghost {
            background: transparent;
            color: var(--muted);
            border-color: var(--line);
            font-weight: 500;
        }
        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 34px;
            margin-bottom: 20px;
        }
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--input-bg);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 6px 8px 6px 14px;
            font-size: 14px;
            font-family: -apple-system, system-ui, sans-serif;
        }
        .chip button {
            border: none;
            background: none;
            color: var(--muted);
            font-size: 15px;
            line-height: 1;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 50%;
        }
        .chip button:hover { color: var(--bad); }
        .empty-hint {
            color: var(--muted);
            font-size: 13.5px;
            font-family: -apple-system, system-ui, sans-serif;
        }
        .setup-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .toolbar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 12px;
        }
        .wrap {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 10px;
            overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; min-width: 640px; }
        th, td {
            padding: 10px 12px;
            text-align: left;
            font-size: 14px;
            border-bottom: 1px solid var(--line);
        }
        th {
            font-family: -apple-system, system-ui, sans-serif;
            font-weight: 600;
            font-size: 12px;
            color: var(--muted);
            white-space: nowrap;
        }
        tbody tr:last-child td { border-bottom: none; }
        td.materia { font-weight: 600; }
        input.nota {
            width: 56px;
            padding: 6px 4px;
            text-align: center;
            font-size: 14px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--input-bg);
            color: var(--ink);
            font-family: inherit;
        }
        input.nota:focus {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }
        td.soma, td.media {
            font-family: -apple-system, system-ui, sans-serif;
            font-variant-numeric: tabular-nums;
        }
        .tag {
            font-family: -apple-system, system-ui, sans-serif;
            font-size: 12px;
            font-weight: 600;
            padding: 3px 9px;
            border-radius: 20px;
            display: inline-block;
        }
        .tag.ok { color: var(--ok); background: var(--ok-bg); }
        .tag.bad { color: var(--bad); background: var(--bad-bg); }

        footer {
            max-width: 920px;
            margin: 24px auto 60px;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            font-family: -apple-system, system-ui, sans-serif;
        }
        @media (max-width:700px) { footer { grid-template-columns: 1fr 1fr; } }
        @media (max-width:480px) { footer { grid-template-columns: 1fr; } }
        .stat {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 14px 16px;
        }
        .stat h2 {
            margin: 0 0 10px;
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            font-family: -apple-system, system-ui, sans-serif;
        }
        .stat ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
        .stat li { font-size: 14px; font-family: "Iowan Old Style", Georgia, serif; }
        .stat.empty { color: var(--muted); font-size: 13px; }
        .avg { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 10px; }
        .avg b { font-size: 26px; font-family: "Iowan Old Style", Georgia, serif; }
        .avg span { font-size: 12px; color: var(--muted); }

        @media (max-width:480px) {
            h1 { font-size: 19px; }
            th, td { padding: 8px 8px; font-size: 13px; }
            .setup-form { flex-direction: column; }
        }
    </style>
</head>

<body>
    <header>
        <h1 id="pageTitle">Boletim</h1>
        <p class="sub" id="pageSub">Cadastre as matérias para montar seu boletim.</p>
    </header>

    <main>
        <section id="setupScreen" class="setup-panel">
            <form class="setup-form" id="subjectForm">
                <input type="text" id="subjectInput" placeholder="Nome da matéria (ex: Biologia)" autocomplete="off">
                <button type="submit" class="btn">Adicionar</button>
            </form>
            <div class="chips" id="chipsList">
                <span class="empty-hint">Nenhuma matéria adicionada ainda.</span>
            </div>
            <div class="setup-actions">
                <button type="button" class="btn ghost" id="cancelEditBtn" hidden>Cancelar</button>
                <button type="button" class="btn" id="startBtn" disabled>Montar boletim</button>
            </div>
        </section>

        <section id="boletimScreen" hidden>
            <div class="toolbar">
                <button type="button" class="btn secondary" id="editSubjectsBtn">Editar matérias</button>
            </div>
            <div class="wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Matéria</th>
                            <th>Bim 1</th>
                            <th>Bim 2</th>
                            <th>Bim 3</th>
                            <th>Bim 4</th>
                            <th>Soma</th>
                            <th>÷4</th>
                            <th>Situação</th>
                        </tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <footer id="statsFooter" hidden>
        <div class="stat avg"><b id="statAvg">0,00</b><span>Média geral</span></div>
        <div class="stat">
            <h2 id="labelOk">Aprovadas</h2>
            <ul id="listOk"></ul>
        </div>
        <div class="stat">
            <h2 id="labelIncomplete">Incompletas</h2>
            <ul id="listIncomplete"></ul>
        </div>
        <div class="stat">
            <h2 id="labelFail">Reprovadas</h2>
            <ul id="listFail"></ul>
        </div>
    </footer>

    <script>
        const SUBJECTS_KEY = 'boletim-subjects-v1';
        const GRADES_KEY = 'boletim-grades-v1';

        function loadSubjects() {
            try {
                const raw = localStorage.getItem(SUBJECTS_KEY);
                if (raw) return JSON.parse(raw);
            } catch (e) { }
            return [];
        }
        function saveSubjects(list) {
            try { localStorage.setItem(SUBJECTS_KEY, JSON.stringify(list)); } catch (e) { }
        }
        function loadGrades() {
            try {
                const raw = localStorage.getItem(GRADES_KEY);
                if (raw) return JSON.parse(raw);
            } catch (e) { }
            return {};
        }
        function saveGrades(obj) {
            try { localStorage.setItem(GRADES_KEY, JSON.stringify(obj)); } catch (e) { }
        }
        function fmt(n) { return n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

        let subjects = loadSubjects();
        let grades = loadGrades();

        const setupScreen = document.getElementById('setupScreen');
        const boletimScreen = document.getElementById('boletimScreen');
        const statsFooter = document.getElementById('statsFooter');
        const pageTitle = document.getElementById('pageTitle');
        const pageSub = document.getElementById('pageSub');
        const chipsList = document.getElementById('chipsList');
        const startBtn = document.getElementById('startBtn');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        const subjectForm = document.getElementById('subjectForm');
        const subjectInput = document.getElementById('subjectInput');

        let editingDraft = [];
        let isEditingExisting = false;

        function renderChips() {
            if (!editingDraft.length) {
                chipsList.innerHTML = '<span class="empty-hint">Nenhuma matéria adicionada ainda.</span>';
            } else {
                chipsList.innerHTML = editingDraft.map((name, i) =>
                    '<span class="chip">' + name + '<button type="button" data-i="' + i + '" aria-label="Remover">×</button></span>'
                ).join('');
                chipsList.querySelectorAll('button').forEach(b => {
                    b.addEventListener('click', () => {
                        editingDraft.splice(+b.dataset.i, 1);
                        renderChips();
                    });
                });
            }
            startBtn.disabled = editingDraft.length === 0;
        }

        subjectForm.addEventListener('submit', e => {
            e.preventDefault();
            const name = subjectInput.value.trim();
            if (!name) return;
            if (editingDraft.some(s => s.toLowerCase() === name.toLowerCase())) {
                subjectInput.value = '';
                return;
            }
            editingDraft.push(name);
            subjectInput.value = '';
            subjectInput.focus();
            renderChips();
        });

        function showSetup(editing) {
            isEditingExisting = editing;
            editingDraft = editing ? [...subjects] : [];
            pageTitle.textContent = editing ? 'Editar matérias' : 'Boletim';
            pageSub.textContent = editing
                ? 'Adicione ou remova matérias. As notas já lançadas são mantidas.'
                : 'Cadastre as matérias para montar seu boletim.';
            cancelEditBtn.hidden = !editing;
            renderChips();
            setupScreen.hidden = false;
            boletimScreen.hidden = true;
            statsFooter.hidden = true;
            subjectInput.focus();
        }

        cancelEditBtn.addEventListener('click', () => showBoletim());

        startBtn.addEventListener('click', () => {
            subjects = [...editingDraft];
            saveSubjects(subjects);
            Object.keys(grades).forEach(k => { if (!subjects.includes(k)) delete grades[k]; });
            saveGrades(grades);
            showBoletim();
        });

        document.getElementById('editSubjectsBtn').addEventListener('click', () => showSetup(true));

        function showBoletim() {
            pageTitle.textContent = 'Boletim';
            pageSub.textContent = 'Toque numa nota para editar. Soma, média e situação recalculam sozinhas.';
            setupScreen.hidden = true;
            boletimScreen.hidden = false;
            statsFooter.hidden = false;
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('tbody');
            tbody.innerHTML = '';
            const aprovadas = [], reprovadas = [], incompletas = [];
            let avgSum = 0, avgCount = 0;

            subjects.forEach(nome => {
                if (!grades[nome]) grades[nome] = [null, null, null, null];
                const b = grades[nome];
                const notas = b.filter(v => v !== null && v !== '' && !isNaN(v)).map(Number);
                const completo = notas.length === 4;
                const soma = notas.reduce((a, x) => a + x, 0);
                const media = notas.length ? soma / 4 : 0;
                const aprovado = completo && media >= 6.0;

                if (completo) {
                    avgSum += media; avgCount++;
                    (aprovado ? aprovadas : reprovadas).push(nome);
                } else {
                    incompletas.push(nome);
                }

                let cells = '<td class="materia">' + nome + '</td>';
                for (let c = 0; c < 4; c++) {
                    const v = b[c];
                    cells += '<td><input class="nota" inputmode="decimal" data-nome="' + nome + '" data-c="' + c + '" value="' + (v === null ? '' : fmt(v)) + '" placeholder="—"></td>';
                }
                cells += '<td class="soma">' + (notas.length ? fmt(soma) : '—') + '</td>';
                cells += '<td class="media">' + (notas.length ? fmt(media) : '—') + '</td>';
                cells += '<td>' + (completo ? '<span class="tag ' + (aprovado ? 'ok' : 'bad') + '">' + (aprovado ? 'Aprovado' : 'Reprovado') + '</span>' : '<span class="tag bad">Incompleto</span>') + '</td>';

                const tr = document.createElement('tr');
                tr.innerHTML = cells;
                tbody.appendChild(tr);
            });

            document.getElementById('labelOk').textContent = 'Aprovadas (' + aprovadas.length + ')';
            document.getElementById('labelIncomplete').textContent = 'Incompletas (' + incompletas.length + ')';
            document.getElementById('labelFail').textContent = 'Reprovadas (' + reprovadas.length + ')';
            document.getElementById('listOk').innerHTML = aprovadas.length ? aprovadas.map(n => '<li>' + n + '</li>').join('') : '<li class="empty">Nenhuma ainda</li>';
            document.getElementById('listIncomplete').innerHTML = incompletas.length ? incompletas.map(n => '<li>' + n + '</li>').join('') : '<li class="empty">Nenhuma</li>';
            document.getElementById('listFail').innerHTML = reprovadas.length ? reprovadas.map(n => '<li>' + n + '</li>').join('') : '<li class="empty">Nenhuma ainda</li>';
            document.getElementById('statAvg').textContent = avgCount ? fmt(avgSum / avgCount) : '0,00';

            tbody.querySelectorAll('input.nota').forEach(inp => {
                inp.addEventListener('change', e => {
                    const nome = e.target.dataset.nome, c = +e.target.dataset.c;
                    const raw = e.target.value.replace(',', '.').trim();
                    grades[nome][c] = raw === '' ? null : Math.max(0, Math.min(10, parseFloat(raw)));
                    saveGrades(grades);
                    renderTable();
                });
            });
        }

        if (subjects.length) { showBoletim(); } else { showSetup(false); }
    </script>
</body>

</html>
